<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VowCue</title>
    <link rel="icon" type="image/png" href="assets/vowcue-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div>
          <div class="brand-lockup">
            <img class="brand-icon" src="assets/vowcue-icon.png" alt="" />
            <h1 class="brand-name">VowCue</h1>
          </div>
          <label class="event-name-field">
            Event Name
            <input id="eventNameInput" type="text" placeholder="Smith / Johnson Wedding" required />
          </label>
        </div>
        <div class="top-actions">
          <div class="save-state" id="saveState">Local saved</div>
          <div class="tool-state" id="toolState">Import tools unchecked</div>
          <div class="update-state" id="updateState" hidden>Checking updates</div>
          <div class="show-state" id="showState">Ready</div>
          <button class="utility-button show-mode-button" id="showModeButton" type="button" aria-pressed="false">Show Mode</button>
          <div class="fade-rocker" aria-label="Fade duration">
            <button class="rocker-button" id="fadeDurationDownButton" type="button" aria-label="Decrease fade duration">-</button>
            <div class="rocker-value">
              <span>Fade</span>
              <strong id="fadeDurationValue">5s</strong>
            </div>
            <button class="rocker-button" id="fadeDurationUpButton" type="button" aria-label="Increase fade duration">+</button>
          </div>
          <button class="utility-button" id="eventPanelButton" type="button">Event</button>
        </div>
        <input id="openEventInput" type="file" accept=".wed,application/json" hidden />
      </header>

      <section class="top-panel" id="eventPanel" hidden>
        <button class="utility-button danger-utility-button" id="newEventButton">New Event</button>
        <button class="utility-button" id="openEventButton">Open .wed</button>
        <button class="utility-button" id="saveEventButton">Save .wed</button>
        <button class="utility-button" id="installToolsButton" type="button" hidden>Install Import Tools</button>
        <button class="utility-button" id="viewUpdateButton" type="button" hidden>View Update</button>
        <div class="promptboard-panel" aria-label="PromptBoard integration">
          <label class="toggle-line promptboard-toggle">
            <input id="promptBoardEnabled" type="checkbox" />
            <span>PromptBoard</span>
          </label>
          <label class="promptboard-url-field">
            Viewer Server
            <input id="promptBoardUrlInput" type="url" placeholder="http://192.168.1.10:8787" />
          </label>
          <button class="utility-button" id="promptBoardTestButton" type="button">Test</button>
          <div class="promptboard-status" id="promptBoardStatus">Off</div>
        </div>
      </section>

      <nav class="page-tabs" aria-label="Playback pages" role="tablist">
        <button
          class="page-tab is-active"
          type="button"
          data-page-tab="reception"
          aria-controls="receptionPage"
          aria-selected="true"
          role="tab"
        >
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 22h8" />
            <path d="M12 15v7" />
            <path d="M7 3h10l-1.2 6.1a3.9 3.9 0 0 1-7.6 0L7 3Z" />
          </svg>
          Reception
        </button>
        <button
          class="page-tab"
          type="button"
          data-page-tab="ceremony"
          aria-controls="ceremonyPage"
          aria-selected="false"
          role="tab"
        >
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="8.5" cy="13.5" r="4.5" />
            <circle cx="15.5" cy="13.5" r="4.5" />
            <path d="M12 9.2 14.2 6l-2.2-3-2.2 3L12 9.2Z" />
          </svg>
          Ceremony
        </button>
      </nav>

      <section class="preflight-panel" id="preflightPanel" aria-label="Event preflight">
        <div class="preflight-item">
          <span>Playback</span>
          <strong id="playbackStateLabel">Idle</strong>
        </div>
        <div class="preflight-item">
          <span>Page Ready</span>
          <strong id="pageReadyLabel">0/0</strong>
        </div>
        <div class="preflight-item">
          <span>Needs Attention</span>
          <strong id="attentionLabel">0</strong>
        </div>
        <div class="preflight-message" id="preflightMessage">Load cues and test output before show mode.</div>
      </section>

      <section class="now-playing" aria-live="polite">
        <div class="now-copy">
          <p class="eyebrow">Now Playing</p>
          <h2 id="nowTitle">Nothing playing</h2>
          <p id="nowMeta">Ready.</p>
        </div>
        <div class="remaining-panel">
          <p class="eyebrow" id="remainingLabel">Time Remaining</p>
          <div class="remaining-time" id="remainingTime">00:00</div>
          <div class="output-meter" aria-label="Output audio meter">
            <div class="meter-head">
              <span>Output</span>
              <strong id="outputMeterLabel">Silent</strong>
            </div>
            <div class="meter-track" aria-hidden="true">
              <span class="meter-fill" id="outputMeterFill"></span>
            </div>
          </div>
        </div>
        <div class="waveform-track" aria-label="Playback progress">
          <canvas id="waveformCanvas"></canvas>
        </div>
        <div class="time-readout">
          <span>Elapsed <strong id="elapsedTime">00:00</strong></span>
          <span>Total <strong id="durationTime">00:00</strong></span>
        </div>
      </section>

      <section class="page-panel is-active" id="receptionPage" data-page-panel="reception" role="tabpanel">
        <section class="cue-grid" id="cueGrid" aria-label="Reception cues"></section>
      </section>

      <section class="page-panel ceremony-page" id="ceremonyPage" data-page-panel="ceremony" hidden role="tabpanel">
        <section class="cue-grid" id="ceremonyCueGrid" aria-label="Ceremony cues"></section>
      </section>
    </main>

    <template id="cueTemplate">
      <article class="cue-card">
        <div class="cue-head">
          <div>
            <p class="cue-number"></p>
            <h3 class="cue-title"></h3>
          </div>
          <span class="status-pill"></span>
        </div>

        <div class="file-cell">
          <p class="cue-song-title">No song title</p>
          <p class="file-name">No file selected</p>
          <p class="cue-meta">No planned fades</p>
          <button class="cue-setup-button" type="button">Setup</button>
        </div>

        <div class="fade-row">
          <label class="toggle-line">
            <input class="fade-in-enabled" type="checkbox" />
            <span>Fade in</span>
          </label>
          <label>
            In @
            <input class="fade-in-at" type="text" inputmode="numeric" placeholder="00:00" />
          </label>
          <label class="toggle-line">
            <input class="fade-enabled" type="checkbox" />
            <span>Fade out</span>
          </label>
          <label>
            Out @
            <input class="fade-at" type="text" inputmode="numeric" placeholder="02:30" />
          </label>
        </div>

        <div class="cue-actions">
          <button class="play-button hold-button" type="button" disabled><span>Hold To Play</span></button>
          <button class="inline-action fade-cue-button" type="button" hidden>Fade</button>
          <button class="inline-action stop-cue-button hold-button" type="button" hidden>
            <span>Hold To Stop</span>
          </button>
        </div>

        <div class="cue-setup-panel" hidden>
          <div class="cue-detail-fields">
            <label>
              Song Title
              <input class="song-title-input" type="text" placeholder="Song title" />
            </label>
            <label>
              Notes
              <textarea class="cue-notes-input" rows="2" placeholder="Optional cue notes"></textarea>
            </label>
          </div>
          <div class="file-actions">
            <label class="file-picker">
              <span class="file-label">Choose audio file</span>
              <input class="file-input" type="file" accept=".mp3,.wav,.m4a,.aac,.aif,.aiff,.flac,audio/*" />
            </label>
            <button class="link-import-button" type="button">Import Link</button>
            <button class="remove-file-button hold-button" type="button"><span>Hold To Remove</span></button>
          </div>
          <div class="link-import-panel" hidden>
            <div class="link-import-row">
              <input class="source-url" type="url" placeholder="Paste source link" />
              <button class="stub-import-button" type="button">Import Audio</button>
            </div>
            <div class="import-progress" aria-hidden="true">
              <span class="import-progress-fill"></span>
            </div>
            <p class="import-status">No link set</p>
          </div>
        </div>
      </article>
    </template>

    <script src="import-utils.js"></script>
    <script src="logic-utils.js"></script>
    <script src="app.js"></script>
  </body>
</html>
